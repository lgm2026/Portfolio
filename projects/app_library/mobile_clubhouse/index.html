<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content">
<meta name="theme-color" content="#0b0a10">
<title>RKFFMC Mobile Clubhouse</title>
<meta name="description" content="The Raging Knights Firefighter MC mobile clubhouse: club news, events, ride logs, photos and arcade games.">
<meta property="og:title" content="Raging Knights Mobile Clubhouse">
<meta property="og:description" content="Friends, fun, family. Club news, events, ride logs, photos and arcade games.">
<meta property="og:image" content="assets/icon-192.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a10; --orange:#f07818; --orange2:#ffa040; --ink:#f4ede2; --dim:#9a8f80;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0a10; } }
:root[data-theme="dark"]{ --bg:#0b0a10; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 40%, #1d1410 0%, #0b0a10 70%);
  color:var(--ink); overflow:hidden; position:fixed; inset:0;
  font-family:'Rubik', system-ui, sans-serif; touch-action:none;
  -webkit-user-select:none; user-select:none;
}
#wrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
canvas{ display:block; background:#0b0a10; touch-action:none; }
@media (min-aspect-ratio: 1/1){
  canvas{ border-radius:18px; box-shadow:0 0 0 1px rgba(240,120,24,.25), 0 20px 60px rgba(0,0,0,.6); }
}
.gfield{
  position:fixed; z-index:30; display:none;
  background:rgba(255,255,255,.07); color:#f4ede2;
  border:1.5px solid rgba(240,120,24,.7); border-radius:14px; outline:none;
  font-family:'Rubik', system-ui, sans-serif; font-weight:700; letter-spacing:.05em;
  padding:0 12px; caret-color:#ffa040; -webkit-user-select:text; user-select:text;
  -webkit-appearance:none; appearance:none;
}
.gfile{ position:fixed; z-index:31; display:none; opacity:0; cursor:pointer; margin:0; padding:0; border:0; }
.gmulti{ resize:none; padding:8px 12px; line-height:1.35; font-weight:600; letter-spacing:.01em; }
.gfield[type="date"],.gfield[type="time"]{ letter-spacing:.02em; font-weight:700; }
.gfield[type="date"]::-webkit-calendar-picker-indicator,.gfield[type="time"]::-webkit-calendar-picker-indicator{ filter:invert(.85) sepia(.6) saturate(4) hue-rotate(-20deg); cursor:pointer; }
.gfield::placeholder{ color:rgba(244,237,226,.38); font-weight:600; }
.gfield:focus{ border-color:#ffa040; box-shadow:0 0 0 3px rgba(255,140,42,.22), 0 0 16px rgba(255,140,42,.45); background:rgba(255,255,255,.1); }
.gread,.gread:focus{ border-color:rgba(255,255,255,.16); box-shadow:none; background:rgba(8,7,12,.72); font-weight:400; letter-spacing:.01em; line-height:1.45; caret-color:transparent; overflow-y:auto; -webkit-overflow-scrolling:touch; }
/* the welcome page (shown while the clubhouse loads) */
#boot{
  position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse 90% 60% at 50% 26%, rgba(240,120,24,.17), rgba(11,10,16,0) 68%), var(--bg);
  padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom)); text-align:center;
}
#boot .inner{ margin:auto; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:clamp(9px,1.9vh,16px); }
#boot .hero{ position:relative; width:min(50vw,30vh,210px); margin-bottom:clamp(2px,1vh,8px); }
#boot .hero img{ position:relative; display:block; width:100%; filter:drop-shadow(0 12px 26px rgba(0,0,0,.65)); }
#boot .halo{ position:absolute; inset:-20%; border-radius:50%; background:radial-gradient(circle, rgba(255,140,42,.34), rgba(255,140,42,0) 64%); animation:breathe 3.4s ease-in-out infinite; }
#boot .t{ font-size:clamp(25px,8vw,36px); font-weight:800; letter-spacing:.11em; padding-left:.11em; line-height:1.04;
  background:linear-gradient(180deg,#ffe1a0 0%,#ffa040 48%,#e2601a 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 12px rgba(255,120,30,.32)); }
#boot .t2{ display:flex; align-items:center; gap:10px; margin-top:calc(-1 * clamp(3px,.9vh,8px)); font-size:clamp(10px,3vw,12.5px); font-weight:800; letter-spacing:.38em; color:var(--ink); }
#boot .t2 span{ padding-left:.38em; }
#boot .t2::before,#boot .t2::after{ content:''; width:clamp(18px,8vw,38px); height:1px; background:linear-gradient(90deg,rgba(255,160,64,0),rgba(255,160,64,.85)); }
#boot .t2::after{ transform:scaleX(-1); }
#boot .tag{ margin-top:clamp(4px,1.2vh,10px); font-size:clamp(14px,4.2vw,17px); font-weight:800; letter-spacing:.26em; padding-left:.26em; color:var(--ink); }
#boot .tag i{ font-style:normal; color:var(--orange2); padding:0 .28em; }
#boot .what{ margin-top:-4px; max-width:320px; text-wrap:balance; font-size:clamp(12.5px,3.5vw,14.5px); font-weight:500; line-height:1.5; color:#cfc4b0; }
#boot .cta{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:clamp(4px,1.4vh,12px) 0; }
#boot .s{ font-size:clamp(11px,3.1vw,12.5px); font-weight:700; color:var(--dim); letter-spacing:.14em; }
#boot .welcome{ max-width:340px; padding-top:clamp(10px,1.8vh,16px); border-top:1px solid rgba(255,160,64,.22); font-size:clamp(12px,3.35vw,13.5px); font-weight:500; line-height:1.6; color:#b8ad9c; }
#boot .welcome p{ text-wrap:balance; }
#boot .welcome p+p{ margin-top:7px; }
#boot .welcome b{ color:var(--orange2); font-weight:800; letter-spacing:.03em; }
#boot .rise{ animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
#boot .d1{animation-delay:.08s} #boot .d2{animation-delay:.16s} #boot .d3{animation-delay:.26s} #boot .d4{animation-delay:.36s} #boot .d5{animation-delay:.48s}
@keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
@keyframes breathe{ 50%{ opacity:.55; transform:scale(.93); } }
@media (prefers-reduced-motion: reduce){ #boot .rise,#boot .halo{ animation:none } }
#tapstart{
  font-family:inherit; font-weight:800; letter-spacing:.06em; font-size:clamp(16px,4.6vw,19px);
  color:#16100a; background:linear-gradient(180deg,#ffa648,#ec7010);
  border:0; border-radius:16px; padding:16px 34px; cursor:pointer; display:none;
  box-shadow:0 0 22px rgba(255,140,42,.55), inset 0 1px 0 rgba(255,255,255,.45);
  animation:glow 1.6s ease-in-out infinite;
}
@keyframes glow{ 50%{ box-shadow:0 0 34px rgba(255,140,42,.85), inset 0 1px 0 rgba(255,255,255,.45);} }
@media (prefers-reduced-motion: reduce){ #tapstart{animation:none} }
#tapstart:active{transform:translateY(2px)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="270" height="480"></canvas>
  <div id="boot">
   <div class="inner">
    <div class="hero rise"><div class="halo"></div><img src="assets/crest.png" alt="Raging Knights crest"></div>
    <div class="t rise d1">RAGING KNIGHTS</div>
    <div class="t2 rise d1"><span>MOBILE CLUBHOUSE</span></div>
    <div class="tag rise d2">FRIENDS<i>&bull;</i>FUN<i>&bull;</i>FAMILY</div>
    <div class="what rise d2">Club resources, pastimes, ride logs, photo dumps &amp; more.</div>
    <div class="cta rise d3">
      <div class="s" id="bootmsg">LOADING&hellip;</div>
      <button id="tapstart">&#9658; KICKSTANDS UP</button>
    </div>
    <div class="welcome rise d4">
      <p><b>Members</b> log their rides and chat with the club &mdash; their own battalion or any other.</p>
      <p><b>Everyone</b> is invited to see our announcements, upcoming events and more!</p>
    </div>
   </div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/avatar.js"></script>
<script src="js/scenes_core.js"></script>
<script src="js/scenes_ride.js"></script>
<script src="js/scenes_games.js"></script>
<script src="js/scenes_arcade.js"></script>
<script src="js/scenes_slots.js"></script>
<script src="js/game_blackjack.js"></script>
<script src="js/game_pong.js"></script>
<script src="js/game_darts.js"></script>
<script src="js/game_pool.js"></script>
<script src="js/accounts.js"></script>
<script src="js/club.js"></script>
<script src="js/roster.js"></script>
<script src="js/admin.js"></script>
<script src="js/bulletin.js"></script>
<script src="js/positions.js"></script>
<script src="js/chat.js"></script>
<script src="js/horizon.js"></script>
<script src="js/office.js"></script>
<script src="js/photos.js"></script>
<script src="js/ridelog.js"></script>
<script src="js/dash.js"></script>
<script src="js/scenes_meta.js"></script>
<script>window.addEventListener('load',()=>RKA.boot());</script>
</body>
</html>
