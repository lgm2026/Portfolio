<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content">
<meta name="theme-color" content="#0b0d12">
<title>App Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 1) the defaults, 2) this rendition's changes. Both load before anything is drawn. -->
<script src="js/config.js"></script>
<script src="js/rendition.js"></script>
<style>
/* every color is a CSS variable filled in by js/theme.js from CONFIG.theme */
:root{ --bg:#0b0d12; --font:system-ui, sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0d12; } }
:root[data-theme="dark"]{ --bg:#0b0d12; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 40%, var(--glow) 0%, var(--bg) 70%);
  color:var(--ink); overflow:hidden; position:fixed; inset:0;
  font-family:var(--font); touch-action:none; -webkit-user-select:none; user-select:none;
}
#wrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
canvas{ display:block; background:var(--bg); touch-action:none; }
@media (min-aspect-ratio: 1/1){ canvas{ border-radius:18px; box-shadow:0 0 0 1px var(--accent-25), 0 20px 60px rgba(0,0,0,.6); } }
/* native fields laid over the canvas (engine.js G.field / G.fileField / G.linkField) */
.gfield{
  position:fixed; z-index:30; display:none;
  background:rgba(255,255,255,.07); color:var(--ink);
  border:1.5px solid var(--accent-70); border-radius:14px; outline:none;
  font-family:var(--font); font-weight:700; letter-spacing:.05em;
  padding:0 12px; caret-color:var(--hi); -webkit-user-select:text; user-select:text; -webkit-appearance:none; appearance:none;
}
.gfile{ position:fixed; z-index:31; display:none; opacity:0; cursor:pointer; margin:0; padding:0; border:0; }
.gmulti{ resize:none; padding:8px 12px; line-height:1.35; font-weight:600; letter-spacing:.01em; }
.gfield[type="date"],.gfield[type="time"]{ letter-spacing:.02em; font-weight:700; }
.gfield::placeholder{ color:rgba(255,255,255,.38); font-weight:600; }
.gfield:focus{ border-color:var(--hi); box-shadow:0 0 0 3px var(--hi-22), 0 0 16px var(--hi-35); background:rgba(255,255,255,.1); }
.gread,.gread:focus{ border-color:rgba(255,255,255,.16); box-shadow:none; background:rgba(8,7,12,.72); font-weight:400; letter-spacing:.01em; line-height:1.45; caret-color:transparent; overflow-y:auto; -webkit-overflow-scrolling:touch; }
/* the welcome page (shown while the app loads) */
#boot{
  position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse 90% 60% at 50% 26%, var(--hi-17), transparent 68%), var(--bg);
  padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom)); text-align:center;
}
#boot .inner{ margin:auto; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:clamp(9px,1.9vh,16px); }
#boot .hero{ position:relative; width:min(46vw,26vh,190px); }
#boot .hero img{ position:relative; display:block; width:100%; filter:drop-shadow(0 12px 26px rgba(0,0,0,.65)); }
#boot .halo{ position:absolute; inset:-20%; border-radius:50%; background:radial-gradient(circle, var(--hi-35), transparent 64%); animation:breathe 3.4s ease-in-out infinite; }
#boot .t{ font-size:clamp(25px,8vw,36px); font-weight:800; letter-spacing:.11em; padding-left:.11em; line-height:1.04;
  background:linear-gradient(180deg,#ffffff 0%,var(--hi) 55%,var(--lo) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
#boot .t2{ display:flex; align-items:center; gap:10px; font-size:clamp(10px,3vw,12.5px); font-weight:800; letter-spacing:.38em; color:var(--ink); }
#boot .t2 span{ padding-left:.38em; }
#boot .t2::before,#boot .t2::after{ content:''; width:clamp(18px,8vw,38px); height:1px; background:linear-gradient(90deg,transparent,var(--hi-85)); }
#boot .t2::after{ transform:scaleX(-1); }
#boot .tag{ margin-top:clamp(4px,1.2vh,10px); font-size:clamp(14px,4.2vw,17px); font-weight:800; letter-spacing:.26em; padding-left:.26em; color:var(--ink); }
#boot .tag i{ font-style:normal; color:var(--hi); padding:0 .28em; }
#boot .what{ margin-top:-4px; max-width:320px; text-wrap:balance; font-size:clamp(12.5px,3.5vw,14.5px); font-weight:500; line-height:1.5; color:var(--sub); }
#boot .cta{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:clamp(4px,1.4vh,12px) 0; }
#boot .s{ font-size:clamp(11px,3.1vw,12.5px); font-weight:700; color:var(--dim); letter-spacing:.14em; }
#boot .welcome{ max-width:340px; padding-top:clamp(10px,1.8vh,16px); border-top:1px solid var(--hi-22); font-size:clamp(12px,3.35vw,13.5px); font-weight:500; line-height:1.6; color:var(--sub); }
#boot .welcome p{ text-wrap:balance; }
#boot .welcome p+p{ margin-top:7px; }
#boot .welcome b{ color:var(--hi); font-weight:800; letter-spacing:.03em; }
#boot .rise{ animation:rise .7s cubic-bezier(.2,.7,.2,1) both; }
#boot .d1{animation-delay:.08s} #boot .d2{animation-delay:.16s} #boot .d3{animation-delay:.26s} #boot .d4{animation-delay:.36s}
@keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
@keyframes breathe{ 50%{ opacity:.55; transform:scale(.93); } }
#tapstart{
  font-family:inherit; font-weight:800; letter-spacing:.06em; font-size:clamp(16px,4.6vw,19px);
  color:var(--on); background:linear-gradient(180deg,var(--hi),var(--lo));
  border:0; border-radius:16px; padding:16px 34px; cursor:pointer; display:none;
  box-shadow:0 0 22px var(--hi-55), inset 0 1px 0 rgba(255,255,255,.45); animation:glow 1.6s ease-in-out infinite;
}
@keyframes glow{ 50%{ box-shadow:0 0 34px var(--hi-85), inset 0 1px 0 rgba(255,255,255,.45);} }
@media (prefers-reduced-motion: reduce){ #boot .rise,#boot .halo,#tapstart{ animation:none } }
#tapstart:active{transform:translateY(2px)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="270" height="480"></canvas>
  <div id="boot">
   <div class="inner">
    <div class="hero rise" id="b-hero"><div class="halo"></div><img id="b-logo" src="" alt=""></div>
    <div class="t rise d1" id="b-title"></div>
    <div class="t2 rise d1" id="b-sub"></div>
    <div class="tag rise d2" id="b-tag"></div>
    <div class="what rise d2" id="b-what"></div>
    <div class="cta rise d3">
      <div class="s" id="bootmsg">LOADING&hellip;</div>
      <button id="tapstart">START</button>
    </div>
    <div class="welcome rise d4" id="b-welcome"></div>
   </div>
  </div>
</div>
<script src="js/theme.js"></script>
<!-- core (keep this order) -->
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/icons.js"></script>
<script src="js/art.js"></script>
<script src="js/ui_list.js"></script>
<script src="js/data.js"></script>
<!-- screens -->
<script src="js/accounts.js"></script>
<script src="js/dash.js"></script>
<script src="js/page.js"></script>
<!-- modules: add one <script> per module file -->
<script src="js/mod_board.js"></script>
<script src="js/mod_blank.js"></script>
<script>window.addEventListener('load',()=>APP.boot());</script>
</body>
</html>
