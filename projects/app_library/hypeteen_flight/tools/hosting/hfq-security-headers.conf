# /etc/nginx/snippets/hfq-security-headers.conf : included by every level of nginx-hfq.conf that sets headers.
# (nginx only inherits add_header into a block that has none of its own; r7 keeps every header in this one file so
#  the page, the bundles and the service worker all carry them. See docs/02_AUDIT_REGISTER.md D02.)
# No third parties at all: fonts are served by the app; the map is drawn from data shipped with the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
