# /etc/nginx/sites-available/hfq   (then: ln -s ../sites-available/hfq /etc/nginx/sites-enabled/hfq)
# Serves dist/ (HypeTeen Flight Academy, r7) as a static site with ordinary access logs, 90-day retention
# (see logrotate-hfq), and headers that keep the app from being framed or its scripts loaded from someone else's page.
# Copy hfq-security-headers.conf to /etc/nginx/snippets/ first.
# r7 fixes (docs/02_AUDIT_REGISTER.md D01, D02): the old file set add_header inside locations, which silently dropped the
# security headers on the page and the bundles, and its referer check was shadowed by an earlier regex location.
# Caching now uses `expires` (not add_header) and every header comes from one include.

log_format hfq_access '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flight.dbmb.io;                 # or dbmb.io/hfq: adjust root/location

    ssl_certificate     /etc/letsencrypt/live/flight.dbmb.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flight.dbmb.io/privkey.pem;

    root /var/www/hfq;                          # = the contents of dist/
    index index.html;
    # mime types come from the http block's mime.types; nginx 1.21+ maps .woff2 and .webmanifest correctly

    access_log /var/log/nginx/hfq.access.log hfq_access;
    error_log  /var/log/nginx/hfq.error.log warn;

    include /etc/nginx/snippets/hfq-security-headers.conf;

    # the page and the service worker are always revalidated, so a new release reaches everyone on the next visit
    location = /index.html { expires -1; }
    location = /sw.js      { expires -1; }

    # scripts: only our own pages (or the service worker) may request them; a copied index.html elsewhere gets 403.
    # This must be the first regex location that matches .js, or it never runs.
    location ~* \.js$ {
        valid_referers none blocked server_names;
        if ($invalid_referer) { return 403; }
        expires 1d;
    }
    # everything else static
    location ~* \.(svg|png|jpg|jpeg|webp|json|woff2|css|webmanifest)$ { expires 7d; }

    gzip on; gzip_types text/javascript application/javascript application/json image/svg+xml text/css application/manifest+json;
}
